[project]
name = "arena"
version = "0.1.0"
description = "Game interface, match simulator and dev games for Zentral Hack 2026"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
arena = "arena.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
