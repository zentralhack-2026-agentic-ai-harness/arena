[project]
name = "arena"
version = "0.1.0"
description = "Game interface and match/tournament simulator for Zentral Hack 2026"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
arena = "arena.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
    "RUF012", # Mutable default value for class attribute
]
